      (function () {
        function init() {
          var info = document.getElementById('osm-credit-text');
          var button = document.getElementById('osm-credit-button');
          if (!info || !button) return;
          function show(value) {
            info.classList.toggle('osm-hidden', !value);
            button.setAttribute('aria-expanded', String(value));
          }
          button.addEventListener('click', function(){ show(info.classList.contains('osm-hidden')); });
          setTimeout(function(){ show(false); }, 5000);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
      })();
